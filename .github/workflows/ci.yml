name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Install, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and production build
        run: npm run check

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: eventos-dist
          path: dist
          retention-days: 7
